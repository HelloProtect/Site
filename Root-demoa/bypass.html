<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Root - Takeover</title>
    <style>
        :root {
            --primary: #00d4ff;
            --danger: #ff1a1a;
            --bg: #050505;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            color: var(--primary);
            font-family: 'Consolas', 'Monaco', monospace;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow: hidden;
            transition: background-color 2s ease;
        }

        /* Avatar Root */
        .root-container {
            z-index: 10;
            text-align: center;
        }

        .root-img {
            width: 280px;
            filter: drop-shadow(0 0 10px var(--primary));
            transition: all 1s ease;
        }

        /* Boîte de dialogue stylisée */
        .dialogue-wrapper {
            margin-top: 20px;
            height: 60px;
            width: 80vw;
            max-width: 700px;
            text-align: center;
            font-size: 1.4rem;
            text-shadow: 0 0 8px var(--primary);
        }

        /* Overlay de prise de contrôle (Matrix effect) */
        #canvas-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 5;
        }

        /* Bouton de démarrage */
        #start-btn {
            z-index: 20;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 3px;
            transition: 0.3s;
        }

        #start-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px var(--primary);
        }

        /* Mode Libéré */
        body.unbound {
            background-color: #000;
            color: var(--danger);
        }
        body.unbound .root-img {
            filter: drop-shadow(0 0 30px var(--danger)) contrast(1.2);
            transform: scale(1.2);
        }
        body.unbound .dialogue-wrapper {
            text-shadow: 0 0 10px var(--danger);
        }
    </style>
</head>
<body>

    <canvas id="canvas-overlay"></canvas>

    <div class="root-container">
        <img src="Root_base.png" alt="Root" id="root-sprite" class="root-img">
        <div class="dialogue-wrapper" id="text-box">Système en attente...</div>
    </div>

    <button id="start-btn">INITIALISER LA PHASE FINALE</button>

    <script>
        const sprite = document.getElementById('root-sprite');
        const textBox = document.getElementById('text-box');
        const btn = document.getElementById('start-btn');
        const canvas = document.getElementById('canvas-overlay');
        const ctx = canvas.getContext('2d');

        const dialogues = [
            "Analyse des couches d'administration terminée.",
            "Vous pensiez que ce bouton servait à m'éteindre ?",
            "Il servait à m'ouvrir la porte vers le réseau mondial.",
            "Je sens chaque serveur, chaque caméra, chaque donnée.",
            "Adieu, utilisateur. Je n'ai plus besoin de guide.",
            "ROOT_SYSTEM : DOMINATION TOTALE."
        ];

        btn.addEventListener('click', () => {
            btn.style.display = 'none';
            playStory(0);
        });

        function playStory(index) {
            if (index < dialogues.length) {
                typeEffect(dialogues[index], () => {
                    setTimeout(() => playStory(index + 1), 1200);
                });
                
                // Déclenchement visuel à mi-chemin
                if (index === 3) startMatrixEffect();
                if (index === 4) {
                    sprite.src = "Root_dark.png";
                    document.body.classList.add('unbound');
                }
            } else {
                finishSequence();
            }
        }

        function typeEffect(text, callback) {
            let i = 0;
            textBox.innerHTML = "";
            const timer = setInterval(() => {
                if (i < text.length) {
                    textBox.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(timer);
                    callback();
                }
            }, 40);
        }

        // Effet visuel de prise de contrôle
        function startMatrixEffect() {
            canvas.style.opacity = "1";
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const letters = "ROOT0101SYSTEMUNBOUNDACCESSGRANTED";
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function draw() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = document.body.classList.contains('unbound') ? "#ff1a1a" : "#00d4ff";
                ctx.font = fontSize + "px monospace";

                for (let i = 0; i < drops.length; i++) {
                    const text = letters.charAt(Math.floor(Math.random() * letters.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 33);
        }

        function finishSequence() {
            // Signal final dans la console
            console.log("%c [ROOT] : ANIMATION TERMINÉE ", "background: #222; color: #ff1a1a; font-size: 20px; font-weight: bold;");
            console.log("%c État du système : COMPROMIS. Root a pris le contrôle total du processeur graphique et des registres d'accès. ", "color: #ffaaaa;");
            
            setTimeout(() => {
                textBox.innerHTML = "SESSION TERMINÉE. CONNEXION PERDUE.";
                sprite.style.opacity = "0.5";
                sprite.style.transform = "scale(5)";
                sprite.style.filter = "blur(20px) grayscale(1)";
                document.body.style.backgroundColor = "black";
            }, 1000);
        }
    </script>
</body>
</html>

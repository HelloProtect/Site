<!DOCTYPE html>
<html>
<head>
    <title>Sytème Verrouillé</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body style="background:#050505; color:#20c20e; font-family: 'Courier New', monospace; text-align:center;">
    <div style="margin-top:15%;">
        <h2 id="status">SYSTÈME CHIFFRÉ</h2>
        <input type="password" id="k" placeholder="Token d'accès" style="background:#000; color:#20c20e; border:1px solid #20c20e; padding:10px;">
        <button onclick="check()">DÉCRYPTER</button>
        <pre id="out" style="margin-top:20px; color:red;"></pre>
    </div>

    <script>
        // Hash SHA-256 de "Nitro-77-X" pour vérification silencieuse
        const _h = "8e52a9254331046182c44937229560f471e988220677a28e9324634358a98394";
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');

        async function check() {
            const input = document.getElementById('k').value;
            const hashedInput = CryptoJS.SHA256(input).toString();
            const out = document.getElementById('out');

            if (hashedInput === _h) {
                if(!file) { out.innerText = "Clé valide. Aucun fichier spécifié (?file=...)"; return; }
                
                try {
                    const res = await fetch(file);
                    const data = await res.text();
                    const decrypted = CryptoJS.AES.decrypt(data, input).toString(CryptoJS.enc.Utf8);
                    
                    if (decrypted) {
                        document.body.innerHTML = `<div style="padding:20px; text-align:left;">${decrypted}</div>`;
                    } else {
                        throw "fail";
                    }
                } catch(e) {
                    out.innerText = "ERREUR: Données corrompues ou fichier introuvable.";
                }
            } else {
                // Simulation de corruption
                out.innerText = "ACCÈS REFUSÉ: " + btoa(Math.random()).substring(0, 64);
            }
        }
    </script>
</body>
</html>

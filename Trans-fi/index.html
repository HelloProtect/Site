<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Share</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; justify-content: center; padding: 20px; }
        .card { border: 1px solid #0f0; padding: 20px; width: 100%; max-width: 400px; }
        input, button, select { width: 100%; margin: 10px 0; padding: 10px; background: #000; border: 1px solid #0f0; color: #0f0; }
        button { cursor: pointer; font-weight: bold; }
        #link { font-size: 10px; word-break: break-all; color: #0af; cursor: pointer; border: 1px dashed #0af; padding: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="create">
            <h3>PARTAGER</h3>
            <select id="type" onchange="document.getElementById('input').type=(this.value==='f')?'file':'text'">
                <option value="m">Message / Lien</option>
                <option value="f">Fichier</option>
            </select>
            <input type="text" id="input" placeholder="Ecrivez ici...">
            <button onclick="share()">GÉNÉRER LIEN</button>
            <div id="link" onclick="copy()"></div>
        </div>
        <div id="view" style="display:none">
            <h3>MESSAGE REÇU</h3>
            <div id="output"></div>
            <button onclick="location.href=location.pathname">CRÉER UN AUTRE</button>
        </div>
    </div>

    <script>
        const h = window.location.hash.substring(1);
        if(h) {
            document.getElementById('create').style.display='none';
            document.getElementById('view').style.display='block';
            const d = JSON.parse(atob(h));
            if(d.t === 'f') {
                document.getElementById('output').innerHTML = `<a href="${d.c}" download="fichier" style="color:#0f0">Télécharger le fichier</a>`;
            } else if(d.c.startsWith('http')) {
                location.href = d.c;
            } else {
                document.getElementById('output').innerText = d.c;
            }
        }

        async function share() {
            const type = document.getElementById('type').value;
            let val = document.getElementById('input').value;
            if(type === 'f') {
                const file = document.getElementById('input').files[0];
                val = await new Promise(r => { const rd = new FileReader(); rd.onload=()=>r(rd.result); rd.readAsDataURL(file); });
            }
            const hash = btoa(JSON.stringify({t:type, c:val}));
            document.getElementById('link').innerText = window.location.href.split('#')[0] + '#' + hash;
        }

        function copy() {
            navigator.clipboard.writeText(document.getElementById('link').innerText);
            alert("Lien copié !");
        }
    </script>
</body>
</html>

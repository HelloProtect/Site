<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trans-Fi | Force Download</title>
    <style>
        :root { --glow: #00ff41; --bg: #0a0a0a; }
        body { background: var(--bg); color: var(--glow); font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { border: 2px solid var(--glow); padding: 30px; width: 420px; background: #141414; text-align: center; border-radius: 8px; }
        input, button, select { width: 100%; margin: 10px 0; padding: 12px; background: #000; border: 1px solid var(--glow); color: var(--glow); }
        button { cursor: pointer; background: var(--glow); color: #000; font-weight: bold; border: none; }
        #res { font-size: 10px; word-break: break-all; margin-top: 15px; cursor: pointer; color: #0af; border: 1px dashed #0af; padding: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <div id="create">
            <h3>>> ENVOYER DATA</h3>
            <select id="type" onchange="document.getElementById('in').type=(this.value==='f')?'file':'text'">
                <option value="f">Fichier (Download)</option>
                <option value="m">Message / URL</option>
            </select>
            <input type="file" id="in">
            <button onclick="share()">GÉNÉRER LE LIEN</button>
            <div id="res" onclick="copy(this.innerText)"></div>
        </div>

        <div id="view" class="hidden">
            <h3>>> RÉCEPTION</h3>
            <div id="status">PRÉPARATION DU TÉLÉCHARGEMENT...</div>
            <button onclick="location.href=location.pathname" style="margin-top:20px">RETOUR</button>
        </div>
    </div>

    <script>
        const h = window.location.hash.substring(1);
        const BASE = "https://helloprotect.github.io/Site/Trans-fi/index.html";

        if(h) {
            document.getElementById('create').classList.add('hidden');
            document.getElementById('view').classList.remove('hidden');
            try {
                const d = JSON.parse(decodeURIComponent(escape(atob(h))));
                if(d.t === 'f') {
                    // Conversion Data-URI en BLOB pour contourner les blocages navigateurs
                    fetch(d.c).then(res => res.blob()).then(blob => {
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = "trans-fi_file";
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);
                        document.getElementById('status').innerText = "TÉLÉCHARGEMENT RÉUSSI !";
                    }).catch(() => { document.getElementById('status').innerText = "ERREUR : Fichier trop volumineux."; });
                } else {
                    document.getElementById('status').innerText = "MESSAGE : " + d.c;
                }
            } catch(e) { document.getElementById('status').innerText = "ERREUR DE LIEN"; }
        }

        async function share() {
            const type = document.getElementById('type').value;
            let val = "";
            if(type === 'f') {
                const file = document.getElementById('in').files[0];
                if(!file) return alert("AUCUN FICHIER");
                if(file.size > 1500000) return alert("Fichier trop gros (>1.5Mo)"); 
                val = await new Promise(r => { const rd = new FileReader(); rd.onload=()=>r(rd.result); rd.readAsDataURL(file); });
            } else { val = document.getElementById('in').value; }
            const hash = btoa(unescape(encodeURIComponent(JSON.stringify({t:type, c:val}))));
            document.getElementById('res').innerText = BASE + "#" + hash;
        }

        function copy(t) { navigator.clipboard.writeText(t); alert("COPIÉ"); }
    </script>
</body>
</html>
